<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Empatia e  <img Cooperação title>
 src="empatia.jpg" alt="Imagem sobre empatia e cooperação">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5fbf9;
            color: #444;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, #72cbb5, #79bce8);
            color: white;
            padding: 50px 20px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 19px;
        }

        section {
            padding: 40px 20px;
        }

        h2 {
            color: #39927e;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .texto {
            max-width: 700px;
            margin: auto;
        }

        .cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            width: 280px;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: #e27d60;
            margin-bottom: 10px;
        }

        .beneficios {
            background: #e8f5f2;
        }

        .beneficios p {
            max-width: 650px;
            margin: 10px auto;
            background: white;
            padding: 12px;
            border-radius: 10px;
        }

        .exemplos {
            background: #fff3ed;
        }

        .exemplo {
            max-width: 650px;
            margin: 12px auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
        }

        .curtida {
            background: linear-gradient(135deg, #ffd9d9, #ffecec);
        }

        .coracao {
            border: none;
            background: white;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            font-size: 45px;
            cursor: pointer;
            box-shadow: 0 5px 15px #ccc;
            transition: 0.2s;
        }

        .coracao:hover {
            transform: scale(1.1);
        }

        .coracao:active {
            transform: scale(1.3);
        }

        #likes {
            display: block;
            margin-top: 12px;
            color: #e25555;
            font-size: 20px;
            font-weight: bold;
        }

        footer {
            background: #3f3d56;
            color: white;
            padding: 25px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 32px;
            }

            .card {
                width: 100%;
                max-width: 330px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>💚 Empatia e Cooperação</h1>

        <p>
            Entender, respeitar e ajudar uns aos outros
            torna o mundo um lugar melhor.
        </p>
    </header>


    <section>
        <h2>🌱 O que é Empatia?</h2>

        <p class="texto">
            Empatia é a capacidade de entender os sentimentos,
            pensamentos e o ponto de vista de outra pessoa.
            É saber ouvir, respeitar e acolher sem julgar.
        </p>

        <div class="cards">

            <div class="card">
                <h3>🧠 Cognitiva</h3>
                <p>
                    Entender os pensamentos e o ponto de vista
                    de outra pessoa.
                </p>
            </div>

            <div class="card">
                <h3>❤️ Emocional</h3>
                <p>
                    Perceber e compreender os sentimentos
                    de outras pessoas.
                </p>
            </div>

            <div class="card">
                <h3>🤝 Compassiva</h3>
                <p>
                    Além de compreender, também agir
                    para ajudar quem precisa.
                </p>
            </div>

        </div>
    </section>

    </section>
    <section>

        <h2>🤝 Cooperação</h2>

        <p class="texto">
            Cooperação é trabalhar em conjunto para alcançar
            objetivos comuns. Quando cooperamos, ouvimos,
            compartilhamos ideias e ajudamos uns aos outros.
        </p>

        <div class="cards">

            <div class="card">
                <h3>🌎 Respeito</h3>
                <p>
                    Valorizar as diferenças e opiniões
                    de cada pessoa.
                </p>
            </div>

            <div class="card">
                <h3>💬 Diálogo</h3>
                <p>
                    Conversar e ouvir com atenção e respeito.
                </p>
            </div>

            <div class="card">
                <h3>🌟 Trabalho em equipe</h3>
                <p>
                    Juntar forças e ideias para alcançar
                    melhores resultados.
                </p>
            </div>

        </div>

    </section>


    <section class="exemplos">

        <h2>💡 Exemplos</h2>

        <div class="exemplo">
            ✔ Ajudar um colega com dificuldades.
        </div>

        <div class="exemplo">
            ✔ Ouvir alguém antes de dar sua opinião.
        </div>

        <div class="exemplo">
            ✔ Compartilhar materiais quando necessário.
        </div>

        <div class="exemplo">
            ✔ Respeitar as ideias de todos.
        </div>

        <div class="exemplo">
            ✔ Participar de campanhas para ajudar quem precisa.
        </div>

    </section>


    <section>

        <h2>💖 Por que isso é importante?</h2>

        <p class="texto">
            A empatia e a cooperação ajudam a criar relações
            mais saudáveis e um ambiente onde todos possam
            se sentir respeitados, ouvidos e valorizados.
        </p>

    </section>


    <section class="curtida">

        <h2>Gostou da página?</h2>

        <p>Deixe seu coração! ❤️</p>

        <br>

        <button class="coracao" onclick="curtir()">
            ❤️
        </button>

        <span id="likes">0 curtidas</span>

    </section>


    <footer>
        🌿 Empatia • Respeito • Cooperação • Solidariedade
    </footer>


    <script>
        let curtidas = 0;

        function curtir() {
            curtidas++;

            document.getElementById("likes").innerText =
                curtidas +
                (curtidas === 1 ? " curtida" : " curtidas");
        }
    </script>

</body>
</html>
